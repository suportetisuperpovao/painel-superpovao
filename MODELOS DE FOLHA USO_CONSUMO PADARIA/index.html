<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="IMG/LOGO.png">
    <meta charset="UTF-8">
    <title>Registro de Uso/Consumo Padaria - Super Povão</title>

    <style>
        @page{
            size:A4 portrait;
            margin:15mm;
        }

        *,
        *::before,
        *::after{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            color:#000;
            background:#fff;
        }

        @media print{
            body{
                margin:0;
            }
        }

        /* Cabeçalho */

        .header{
            display:flex;
            align-items:center;
            border-bottom:2px solid #000;
            padding-bottom:15px;
            margin-bottom:18px;
        }

        .logo{
            width:140px;
            object-fit:contain;
            filter:grayscale(100%);
        }

        .title-container{
            flex:1;
            text-align:center;
        }

        .title-container h1{
            margin:0;
            font-size:24px;
            letter-spacing:1px;
        }

        .title-container h2{
            margin:5px 0 0 0;
            font-size:16px;
            font-weight:normal;
        }

        /* Informações */

        .info-section{
            font-size:14px;
            margin-bottom:20px;
        }

        .info-row{
            display:flex;
            align-items:flex-end;
            margin-bottom:12px;
        }

        .line{
            flex:1;
            height:18px;
            border-bottom:1px solid #000;
            margin-left:6px;
        }

        /* Campo do mês */

        .mes-input{
            border:none;
            border-bottom:1px solid #000;
            background:transparent;
            outline:none;
            font-family:Arial, Helvetica, sans-serif;
            font-size:14px;
            width:120px;
            padding:0 2px;
            margin-left:5px;
        }

        .mes-input:focus{
            border-bottom:1px solid #000;
        }

        @media print{
    .mes-input{
        border: none;
        border-bottom: none;
        background: transparent;
        color:#000;
        -webkit-appearance:none;
        appearance:none;
    }
}

        /* Tabela */

        table{
            width:100%;
            border-collapse:collapse;
            font-size:13px;
            margin-bottom:30px;
        }

        th,
        td{
            border:1px solid #000;
            padding:6px 5px;
        }

        th{
            background:#f2f2f2;
            text-align:center;
            font-weight:bold;
            -webkit-print-color-adjust:exact;
            print-color-adjust:exact;
        }

        td{
            height:24px;
        }

        .col-cod{
            width:25%;
            text-align:center;
        }

        .col-nome{
            width:45%;
            text-align:left;
            padding-left:8px;
        }

        .col-qtd{
            width:10%;
            text-align:center;
        }

        .col-obs{
            width:20%;
            text-align:center;
        }

        /* Rodapé */

        .footer{
            display:flex;
            justify-content:space-around;
            align-items:flex-end;
            font-size:14px;
            margin-top:40px;
        }

        .signature-box{
            width:40%;
            text-align:center;
        }

        .signature-line{
            border-top:1px solid #000;
            padding-top:5px;
        }



        /* Estilo do botão para aparecer na tela */
.btn-imprimir {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
    margin: 20px 0;
    display: block;
}

.btn-imprimir:hover {
    background-color: #0056b3;
}

/* REGRA DE OURO: Esconde o botão e os inputs ao imprimir para o papel sair limpo */
@media print {
    .btn-imprimir {
        display: none !important;
    }
}


    </style>
</head>

<script>
function imprimirRegistro() {
    const mes = document.querySelector('.mes-input');

    if (!mes.value.trim()) {
        alert('Por favor, preencha o mês antes de imprimir.');
        mes.focus();
        return;
    }

    window.print();
}
</script>

<body>

    <button onclick="imprimirRegistro()" class="btn-imprimir">
    🖨️ Imprimir Registro
    </button>


    <div class="header">

        <img src="IMG/LOGO.png" alt="Logo Super Povão" class="logo">

        <div class="title-container">
            <h1>USO/CONSUMO</h1>
            <h2>REGISTRO DE USO/CONSUMO PADARIA</h2>
        </div>

        <div style="width:140px;"></div>

    </div>

    <div class="info-section">

        <div class="info-row">
    <strong>Mês:</strong>
    <input
        type="text"
        class="mes-input"
        maxlength="20"
        placeholder="Digite o mês"
        required>
   </div>

        <div class="info-row">
            <strong>Setor:</strong>
            <div class="line"></div>
        </div>

        <div class="info-row">
            <strong>Responsável pela conferência:</strong>
            <div class="line"></div>
        </div>

    </div>

    <table>

        <thead>

            <tr>
                <th class="col-cod">Código</th>
                <th class="col-nome">Nome do Produto</th>
                <th class="col-qtd">Qtd.</th>
                <th class="col-obs">
                    Observações
                    <br>
                    <span style="font-size:10px;font-weight:normal;">
                        (Data)
                    </span>
                </th>
            </tr>

        </thead>

        <tbody contenteditable="true" style="text-align: center;">

            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td></tr>

        </tbody>

    </table>

    <div class="footer">

        <div class="signature-box">
            <div class="signature-line">
                Assinatura do colaborador
            </div>
        </div>

        <div class="signature-box">
            <div class="signature-line">
                Conferência da gerência
            </div>
        </div>

    </div>

</body>
</html>
